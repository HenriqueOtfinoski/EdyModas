<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Painel — Edy Modas</title>
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-flower" viewBox="0 0 48 48"><g fill="currentColor"><path d="M24 25C16.5 20.5 14.5 11 20.3 4.8a5 5 0 0 1 7.4 0C33.5 11 31.5 20.5 24 25Z" /><path d="M24 25C16.5 20.5 14.5 11 20.3 4.8a5 5 0 0 1 7.4 0C33.5 11 31.5 20.5 24 25Z" transform="rotate(72 24 25)" /><path d="M24 25C16.5 20.5 14.5 11 20.3 4.8a5 5 0 0 1 7.4 0C33.5 11 31.5 20.5 24 25Z" transform="rotate(144 24 25)" /><path d="M24 25C16.5 20.5 14.5 11 20.3 4.8a5 5 0 0 1 7.4 0C33.5 11 31.5 20.5 24 25Z" transform="rotate(216 24 25)" /><path d="M24 25C16.5 20.5 14.5 11 20.3 4.8a5 5 0 0 1 7.4 0C33.5 11 31.5 20.5 24 25Z" transform="rotate(288 24 25)" /></g></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z" /><path d="M3 7.5 12 12l9-4.5M12 12v9" /></g></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="3.5" y="13.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="13.5" width="7" height="7" rx="1.5" /></g></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z" /><circle cx="7.5" cy="8.5" r="1.4" /></g></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l2.9 5.88 6.49.94-4.7 4.58 1.11 6.46L12 17.9l-5.8 3.05 1.1-6.46-4.69-4.58 6.49-.94L12 2.5z" /></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c.8-3.5 3.400-5.500 6.500-5.500s5.700 2 6.500 5.500" /><path d="M16 4.700a3.500 3.500 0 0 1 0 6.600M18.500 14.800c1.500.800 2.600 2.600 3 5.200" /></g></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2" /><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4 5.3 5.3" stroke-linecap="round" /></g></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.500 6.500l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.500 7l1 13h9l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" /></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.500-6.500 10-6.500S22 12 22 12s-3.500 6.500-10 6.500S2 12 2 12z" /><circle cx="12" cy="12" r="2.800" /></g></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l18 18M10.600 5.600A10 10 0 0 1 12 5.500c6.500 0 10 6.500 10 6.500a17 17 0 0 1-3.300 4M6.400 6.900C3.700 8.700 2 12 2 12s3.500 6.500 10 6.500a9.600 9.600 0 0 0 4.200-.900" /></g></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
    <symbol id="i-whatsapp" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z" /><path d="M9 8.3c-.4 2.7 4 7.1 6.7 6.7l.9-1.7-2-1.1-.9.8c-1-.4-2.3-1.7-2.7-2.7l.8-.9-1.1-2z" /></g></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></symbol>
  </svg>

  <!-- Login -->
  <main class="login" id="login" hidden>
    <form class="login__card" id="loginForm" novalidate>
      <div class="brand"><svg class="icon brand__mark"><use href="#i-flower" /></svg> Edy Modas</div>
      <div>
        <h1 class="login__title">Painel da loja</h1>
        <p class="login__sub">Entre para cadastrar produtos, promoções e ver os contatos do site.</p>
      </div>
      <label class="field"><span>Usuário</span><input name="username" autocomplete="username" required /></label>
      <label class="field"><span>Senha</span><input name="password" type="password" autocomplete="current-password" required /></label>
      <p class="form-error" id="loginError" role="alert" hidden></p>
      <button class="btn btn--dark btn--block" type="submit" id="loginBtn">Entrar</button>
      <a class="login__back" href="/">← Voltar para o site</a>
    </form>
  </main>

  <!-- Painel -->
  <div class="app" id="app" hidden>
    <aside class="side">
      <div class="side__top">
        <div class="brand"><svg class="icon brand__mark"><use href="#i-flower" /></svg> Edy Modas</div>
        <span class="side__badge">Painel</span>
      </div>
      <nav class="side__nav" aria-label="Seções do painel">
        <a href="#resumo" data-view="resumo"><svg class="icon"><use href="#i-chart" /></svg> Resumo</a>
        <a href="#produtos" data-view="produtos"><svg class="icon"><use href="#i-box" /></svg> Produtos</a>
        <a href="#colecoes" data-view="colecoes"><svg class="icon"><use href="#i-grid" /></svg> Coleções</a>
        <a href="#promocoes" data-view="promocoes"><svg class="icon"><use href="#i-tag" /></svg> Promoções</a>
        <a href="#depoimentos" data-view="depoimentos"><svg class="icon"><use href="#i-star" /></svg> Depoimentos</a>
        <a href="#contatos" data-view="contatos"><svg class="icon"><use href="#i-users" /></svg> Contatos</a>
        <a href="#config" data-view="config"><svg class="icon"><use href="#i-gear" /></svg> Configurações</a>
      </nav>
      <div class="side__bottom">
        <a class="side__link" href="/" target="_blank" rel="noopener"><svg class="icon"><use href="#i-ext" /></svg> Ver o site</a>
        <button class="side__link" type="button" id="logout"><svg class="icon"><use href="#i-out" /></svg> Sair <span class="side__user" id="whoami"></span></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <p class="topbar__eyebrow" id="viewEyebrow"></p>
          <h1 class="topbar__title" id="viewTitle">Resumo</h1>
        </div>
        <div class="topbar__actions" id="viewActions"></div>
      </header>
      <section class="view" id="view" aria-live="polite"></section>
    </main>
  </div>

  <!-- Formulário de cadastro/edição -->
  <dialog class="dialog" id="editor" aria-labelledby="editorTitle">
    <form class="dialog__card" id="editorForm" novalidate>
      <header class="dialog__head">
        <h2 id="editorTitle">Editar</h2>
        <button class="icon-btn" type="button" data-close aria-label="Fechar"><svg class="icon"><use href="#i-x" /></svg></button>
      </header>
      <div class="dialog__body" id="editorFields"></div>
      <p class="form-error" id="editorError" role="alert" hidden></p>
      <footer class="dialog__foot">
        <button class="btn btn--ghost" type="button" data-close>Cancelar</button>
        <button class="btn btn--dark" type="submit" id="editorSave">Salvar</button>
      </footer>
    </form>
  </dialog>

  <!-- Confirmação -->
  <dialog class="dialog dialog--small" id="confirm" aria-labelledby="confirmTitle">
    <form class="dialog__card" method="dialog">
      <header class="dialog__head"><h2 id="confirmTitle">Tem certeza?</h2></header>
      <div class="dialog__body"><p id="confirmText"></p></div>
      <footer class="dialog__foot">
        <button class="btn btn--ghost" value="cancel">Cancelar</button>
        <button class="btn btn--danger" value="ok" id="confirmOk">Excluir</button>
      </footer>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
